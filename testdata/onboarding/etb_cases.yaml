    pin_policy: APPROVED_SHARED_DEFAULT
    laser_code_policy: APPROVED_SHARED_DEFAULT_FOR_DEV
    prepared_profile_status: PREPARED_PROFILE_ASSUMED_READY
    runtime_status: RUNTIME_EVIDENCE_REQUIRED
    pdpa_reset_required: false
    supported_requirement_baselines:
    - MMP_LOT2_V2
    - POST_MMP_1
    preconditions:
    - Delete CIS ID according to environment policy.
    - No saving account and no products available for selection.
    - PDPA visibility is not yet confirmed for this case.
    - Select MMP Lot2 V.2 or Post-MMP 1 before execution.
    test_steps:
    - Start ETB registration with the prepared no-product profile.
    - Complete the applicable registration and PIN flow. Record PDPA visibility; its expected policy
      is still unresolved.
    - Verify that Select Product is not displayed.
    - Verify the release-specific Pre-SET Success screen. Leave optional settings unchanged and tap Let's
      go.
    - 'Continue through Introduction 3C and verify Control screen: 3C.'
    interpretation_note: User confirmed no products and MUST_SKIP for both releases. This replaces the
      contradictory Select Product text in the original expected result.
