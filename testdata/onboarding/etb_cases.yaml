schema_version: '1.0'
source:
  file: docs/source/testcases/etb/current/QA_TestCase_OPO_ETB Registration_Automation.xlsx
  sheet: Test Cases
  scope: TC-ETB-001..TC-ETB-013
  original_expected_result_baseline: POST_MMP_1
  requirement_confirmation:
    date: '2026-09-21'
    authority: USER_CONFIRMED
    scope: Baselines, TC001 NA and prior PDPA consent, TC003 no-product skip, optional Pre-SET settings
# Requirement metadata below does not add release selection or new assertions to Robot.
# Existing product_selection_policy and pdpa_policy remain the runner-consumed policies.
requirement_baselines:
  MMP_LOT2_V2:
    label: MMP Lot2 V.2
  POST_MMP_1:
    label: Post-MMP 1
    design_revision_note: Wiki Dev V.3 versus cover Version 2 is not resolved by the release confirmation.
pre_setting_requirements:
  applies_to: [TC-ETB-001, TC-ETB-002, TC-ETB-003, TC-ETB-004]
  settings_required: false
  action: Tap Let's go without configuring email, biometric or Passkey
  subsequent_screens: [Introduction 3C, 'Control screen: 3C']
  by_release:
    MMP_LOT2_V2:
      passkey_section: MUST_NOT_DISPLAY
    POST_MMP_1:
      success_title: You're all set!
      passkey_section: MUST_DISPLAY
      add_email_option: MUST_DISPLAY
execution_lifecycle:
  preparation:
    cis_clear: ENVIRONMENT_AWARE
  cleanup:
    cis_clear: ENVIRONMENT_AWARE
domains:
  cis:
    DEV:
      preparation_owner: AUTOMATION
      clear_allowed: according_to_existing_DEV_policy
    SIT:
      preparation_owner: EXTERNAL_TEAM
      clear_allowed: false
      post_test_delete_allowed: false
  pdpa:
    DEV:
      preparation: APPROVED_SHARED_ADAPTER
    SIT:
      preparation: APPROVED_SHARED_ADAPTER
    environment_specific_logic_required: false
cases:
  etb_tc_001:
    tc_id: TC-ETB-001
    name: ETB with NA happy case with previously accepted PDPA Clause 6
    enabled: true
    profile_id: etb_tc_001
    tags:
    - positive
    - pdpa
    expected_branch: ETB happy path; prior PDPA consent; Product Selection required; Confirm PIN not an asserted Post-MMP checkpoint
    product_selection_policy: REQUIRED
    pdpa_policy: MUST_SKIP
    expected_product_categories: []
    expected_screen: 'Control screen: 3C'
    expected_error_code: null
    expected_action: Complete registration flow
    terminal_state: registration success/control screen
    cleanup_required: true
    readiness: READY_TO_ATTEMPT_RUNTIME
    execution_status: APPROVED_TO_PROCEED
    clarification_required: []
    official_expected_result: |-
      Post-MMP 1
      - Do not display PDPA screen.
      - Display Select Product screen.
      - Display Pre-SET Success screen.
      - Display Introduction 3C.
      - Display Control screen: 3C.
    source_row: 4
    data_readiness: UI_DATA_READY
    otp_policy: APPROVED_SHARED_DEFAULT
    pin_policy: APPROVED_SHARED_DEFAULT
    laser_code_policy: APPROVED_SHARED_DEFAULT_FOR_DEV
    prepared_profile_status: PREPARED_PROFILE_ASSUMED_READY
    runtime_status: RUNTIME_EVIDENCE_REQUIRED
    pdpa_reset_required: false
    interpretation_note: User confirmed prior PDPA acceptance. PDPA must not display. Post-MMP assertion focuses on Product Selection, Pre-SET Success, Introduction 3C, and Control 3C; Confirm PIN is not an asserted checkpoint for TC001.
    supported_requirement_baselines:
    - MMP_LOT2_V2
    - POST_MMP_1
    preconditions:
    - Delete CIS ID according to environment policy.
    - ETB with NA. All registration conditions pass.
    - PDPA Clause 6 consent is already accepted and valid for this flow. Do not reset PDPA.
    - At least one eligible product is available.
    - Select MMP Lot2 V.2 or Post-MMP 1 before execution.
    test_steps:
    - Start ETB registration with the prepared profile.
    - Complete the existing identity verification, OTP and face verification flow. Verify that PDPA is
      not displayed.
    - Verify Select Product, select/confirm products and continue.
    - Verify the Pre-SET Success screen.
    - Continue through Introduction 3C and verify Control screen: 3C.
    auth_route: ETB_WITH_NA
    confirm_pin_policy: OPTIONAL
  etb_tc_002:
    tc_id: TC-ETB-002
    name: Customer is Pass all registration conditions and never given PDPA consent
      clause no. 6
    enabled: true
    profile_id: etb_tc_002
    tags:
    - positive
    - pdpa
    expected_branch: positive path with PDPA Clause 6 displayed and accepted
    product_selection_policy: REQUIRED
    pdpa_policy: REQUIRED
    expected_product_categories: []
    expected_screen: 'Control screen: 3C'
    expected_error_code: null
    expected_action: Complete registration flow
    terminal_state: registration success/control screen
    cleanup_required: true
    readiness: READY_TO_ATTEMPT_RUNTIME
    execution_status: APPROVED_TO_PROCEED
    clarification_required: []
    official_expected_result: |-
      MMP Lot2 V.2 / Post-MMP 1
      - Display PDPA and accept consent.
      - Display Select Product and confirm product selection.
      - Display Pre-SET Success (You're all set!).
      - Settings are optional. Tap Let's go without setting up email, biometric or Passkey.
      - Display Introduction 3C, then Control screen: 3C.
      MMP Lot2 V.2: Do not display Set Passkey.
      Post-MMP 1: Display Passkey and Add email as in the confirmed success screen.
    source_row: 5
    data_readiness: UI_DATA_READY
    otp_policy: APPROVED_SHARED_DEFAULT
    pin_policy: APPROVED_SHARED_DEFAULT
    laser_code_policy: APPROVED_SHARED_DEFAULT_FOR_DEV
    prepared_profile_status: PREPARED_PROFILE_ASSUMED_READY
    runtime_status: RUNTIME_EVIDENCE_REQUIRED
    pdpa_reset_required: true
    pdpa_reset_blocker: null
    execution_lifecycle:
      preparation:
        cis_clear: REQUIRED
        pdpa_clear: REQUIRED
      cleanup:
        cis_clear: REQUIRED
        pdpa_clear: BEST_EFFORT
    supported_requirement_baselines:
    - MMP_LOT2_V2
    - POST_MMP_1
