policy:
  canonical_field_precedence:
  - Pre Condition
  - Expected Result / Expected (PostMMP)
  - Remark / Notes
  - Test Case Name
  prepared_profile_policy: PREPARED_PROFILE_ASSUMED_READY unless runtime evidence
    reclassifies it
  pdpa_reset_status: APPROVED_LOCAL_ADAPTER
  pdpa_reset_remark: Approved local PDPA Web Forms preparation adapter is configured
    and statically validated.
  execution_policy: TC-ETB-001..TC-ETB-013 are approved to proceed. Clarification
    notes are informational and non-blocking; runtime evidence may still reclassify
    a prepared profile when the expected branch is not reached.
