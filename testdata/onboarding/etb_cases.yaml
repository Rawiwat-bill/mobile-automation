schema_version: '1.0'
source:
  file: docs/source/testcases/etb/current/QA_TestCase_OPO_ETB Registration_Automation.xlsx
  sheet: Test Cases
  scope: TC-ETB-001..TC-ETB-013
execution_lifecycle:
  preparation:
    cis_clear: ENVIRONMENT_AWARE
  cleanup:
    cis_clear: ENVIRONMENT_AWARE
domains:
  cis:
    DEV:
      preparation_owner: AUTOMATION
      clear_allowed: according_to_existing_DEV_policy
    SIT:
      preparation_owner: EXTERNAL_TEAM
      clear_allowed: false
      post_test_delete_allowed: false
  pdpa:
    DEV:
      preparation: APPROVED_SHARED_ADAPTER
    SIT:
      preparation: APPROVED_SHARED_ADAPTER
    environment_specific_logic_required: false
