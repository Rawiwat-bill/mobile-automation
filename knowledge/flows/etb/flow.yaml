  optional_branches:
  - Check Digital ID in secure storage If there is no digital id in secure storage go to First Page
  - If CIS profile not found or CIS status is invalid, search RM
  - '- Check sum and format of Citizen ID - If customer send information by Tab ‘Thai’ then send idType = ‘CI’ Tab ‘Foreigner’
    then send idType = ‘PP’ Tab ‘Alien ID’ then send idType = ‘AI’ Tab ‘Others’ then send idType = ‘OI’'
  - If RM is found, get customer profile from RM
  - '[CIAM checks #1] 1. ctCode = 09, 52, 11 otherwise return error 2. Check bblIalCode If ctCode = 09 then bblIalCode >=
    21 If result = false, return error Else, Check ID expiry date < Today, return error Else bblIalCode >= 13 If result =
    false, return error Else, Continue check If Passport expiry date < Today, return error If, KYC Next Due date < Today,
    return error 3. riskLevel != 3X, 3U, 3V, 3A, 3B In case result = false, return error 4. Check MB option is available -
    channelStatus = A and - profileStatus=F and - mobile Match with MobileNo. in session If pass all condition then Set isDisplayMB
    = Y Else, isDisplayMB = N Continue to next process [CIAM checks #2]'
  - '[CIAM checks] Compare MobileNo. in session with mobileNumberList From H7 Response If match, then Set isDisplayNA = Y
    Else, isDisplayNA = N *If isDisplayMB = N and isDisplayNA = Y , proceed to call IAM_05 *Else if isDisplayMB = Y and isDisplayNA
    = N then Display screen “Direct to MB” *Else if isDisplayMB = N and isDisplayNA = N then allow user to retry with below
    condition - 10 retries allowed without restriction. - 11th attempt onward, if no option is available, wait 10 minutes
    before next retry - 20th attempt, retry is limited for a day *Else if isDisplayMB = Y and isDisplayNA = Y then Display
    both option on screen'
  - '[AuditLog] in case Fail Only Inquiry wrapper – No token'
  - '[AuditLog] in case Fail Only Step 4 - Customer Enrollment Citizen ID, DOB and Mobile Number - End flow - Customized error
    - End flow - OOTB error'
  - '[CIAM checks #2] 1. Check ctCode = 09 If true, Continue to Call CustomerProfileContactInfoInqService Else if false, Set
    isDisplayNA = N and skip call CustomerProfileContactInfoInqService then mapping response to screen'
  - '[ActivityLog] Step 4 - Customer Enrollment Citizen ID, DOB and Mobile Number - Response 4 - Response (ETB with MB or
    NA) - Response 4 - Response Customer Automatically redirected to MB - Response 4 - Response Customer automatically redirected
    ETB/NA - In flow error Response 4.1 - ETB or Reactivation 1-10 Failed DOB Attempts - In flow error Response 4.2 - ETB
    or Reactivation 1-10 Failed mobile number Attempts - End flow - Customized error - End flow - OOTB error'
  - 'Publish Event Topic: dev.stg.efmconsumer.advice Event Type: XXXX Request: NCBD Session Correlation ID : x-transactionid
    CIS ID : NULL NCBD Registered E-mail : NULL NCBD Registered Phone Number : NULL NCBD User first log on : NULL NCBD registration
    date : NULL Channel - Message Type : ‘Registration’ Channel - Channel Type : x-channel Channel – SubChannel : ‘NCBD’ Channel
    - Server DateTime : System Datetime Authentication Method : NULL Authentication Result : 1:success Transaction Language
    : TH|EN Source System = ‘ApiGee’ SAS Decision Flag = 0:Not use EFM decision TransactionType = ‘PersonalInfo’ TransactionSubType
    = NULL:transaction success | IA Cust Error Code: transaction fail Response:'
  - '[CIAM checks] If customer idType = CI, Continue to IAM_05 Else, Skip IAM05 Continue at IAM_06'
  - Review Security with SM if need to go through Apigee Engagement (ADR_15)
  - '[CIAM checks] code = 0 and desc = สถานะปกติThen, can proceed further *User can retry up to 5 times'
  - '[CIAM checks] If the suspiciousCustomerInfo attribute is present and contains a resultCode, CIAM will evaluate it. If
