    date < Today, return error If, KYC Next Due date < Today, return error 3. riskLevel != 3X, 3U, 3V, 3A, 3B In case result
    = false, return error 4. Check MB option is available - channelStatus = A and - profileStatus=F and - mobile Match with
    MobileNo. in session If pass all condition then Set isDisplayMB = Y Else, isDisplayMB = N Continue to next process [CIAM
    checks #2]'
  - 'If “H21: Get Daily Total Limit” success, then - Use segmentLevel that max dailyTotalLitmit of “H21:Get Daily Total Limit”
    for create CIS profile. Otherwise, return error.'
  - '[Validate] Validate RM has value If, RM has no value and idType in request is ‘PP’ or ‘OI’ or ‘AI’ Then Return Error
    Else If, RM has no value and idType in request is ‘CI’ Then proceed next step following to NTB Flow Else if, RM has value
    Then check DOB - Validate dob from CIS Customer Search by Citizen ID/PP response match with DOB that customer input, If
    no, return error - Validate dob from CIS Customer Search by Citizen ID/PP response ,that user >= 12 years old, If no,
    return error If pass above dob validation then check - If CISID has value and partyBlockedStatus = ‘AC’ and channelTypeValue
    = ‘na’ and partyChennelStatus = ‘AC’ and partyChannelBlock = ‘N’ then Check CHANNEL_STATUS in IAM <> ‘Suspended’. If it
    true then, continue at Reactivate Flow Else, Return Error - Else If CISID has no value or CISID has value and value in
    x-channel does not exist in channelTypeValue then continue to ETB Flow (Call to H19: BBLOwnCustCheckInq) - Else, Return
    Error'
  cleanup_contract: []
