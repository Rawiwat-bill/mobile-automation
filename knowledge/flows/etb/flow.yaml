  - Check Digital ID in secure storage If there is no digital id in secure storage go to First Page
  - '[CIAM App/OS version Checks] If OS version < OS minimal version return end-flow error If app version < app minimal version
    return end-flow (force upgrade required) If app minimum <= app version < recommended minimal version and force upgrade
    < today return end-flow error (force upgrade required) If app minimum <= app version < recommended minimal version and
    force upgrade >= today return in-flow error (recommended upgrade app version)'
  - If CIS profile not found or CIS status is invalid, search RM
  - '- Check sum and format of Citizen ID - If customer send information by Tab ‘Thai’ then send idType = ‘CI’ Tab ‘Foreigner’
    then send idType = ‘PP’ Tab ‘Alien ID’ then send idType = ‘AI’ Tab ‘Others’ then send idType = ‘OI’'
  - '[CIAM validate] - Validate dob from CIS Customer Search by Citizen ID/PP response match with DOB that customer input,
    If no, return error - Validate dob from CIS Customer Search by Citizen ID/PP response ,that user >= 15 years old, If no,
    return error'
  - '[AuditLog] in case Fail Only Inquiry wrapper – No token'
  - '[CIAM checks #1] 1. ctCode = 09, 52, 11 If not, then Return Error 2. Check bblIalCode If ctCode = 09 then bblIalCode
    >= 21 If result = false, return error Else, Check ID expiry date < Today, return error Else bblIalCode >= 13 If result
    = false, return error Else, Continue check If Passport expiry date < Today, return error If, KYC Next Due date < Today,
    return error 3. riskLevel != 3X, 3U, 3V, 3A, 3B In case result = false, return error 4. Check MB option is available -
